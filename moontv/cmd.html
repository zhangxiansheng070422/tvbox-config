<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termux 一键命令</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;padding:24px 18px 40px;background:#0e1116;color:#e8eaed;
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
  h1{font-size:20px;margin:0 0 6px;font-weight:600}
  .sub{color:#8b949e;font-size:13px;margin-bottom:22px}
  .card{background:#161b22;border:1px solid #262d38;border-radius:14px;padding:16px;margin-bottom:16px}
  pre{margin:0 0 14px;padding:14px;background:#0a0d12;border:1px solid #21262d;border-radius:10px;
      font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;
      white-space:pre-wrap;word-break:break-all;color:#7ee787}
  button{display:block;width:100%;padding:15px;border:0;border-radius:11px;font-size:16px;
         font-weight:600;color:#fff;background:#2f81f4;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{background:#1f6fdd}
  button.done{background:#238636}
  .step{color:#c9d1d9;font-size:14px;margin:12px 0 0}
  .step b{color:#2f81f4}
  .alt{font-size:12px;color:#8b949e;margin-top:10px}
  code{background:#0a0d12;padding:2px 6px;border-radius:5px;color:#f0883e;font-size:12px}
</style>
</head>
<body>
  <h1>手机端一键配置</h1>
  <div class="sub">点下面的按钮复制，然后长按 Termux 屏幕选 Paste</div>

  <div class="card">
    <pre id="cmd">bash -c "$(curl -sL https://gh-proxy.com/https://raw.githubusercontent.com/zhangxiansheng070422/tvbox-config/main/moontv/s.sh)"</pre>
    <button id="btn" onclick="doCopy()">复制命令</button>
    <div class="step">① 复制 → ② 切回 Termux → ③ <b>长按屏幕 → Paste → 回车</b></div>
    <div class="alt">如果提示 <code>curl: command not found</code>，先执行 <code>pkg install -y curl</code></div>
  </div>

<script>
function doCopy(){
  var t = document.getElementById('cmd').innerText.trim();
  var btn = document.getElementById('btn');
  function ok(){ btn.textContent='已复制 ✓'; btn.classList.add('done');
                 setTimeout(function(){btn.textContent='复制命令';btn.classList.remove('done')},2000); }
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=t;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,99999);
    try{ document.execCommand('copy'); ok(); }
    catch(e){ btn.textContent='请长按上方文字手动复制'; }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(ok).catch(fallback);
  } else { fallback(); }
}
</script>
</body>
</html>
