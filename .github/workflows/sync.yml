name: sync-sources

# 定时把 sources.txt 里的订阅合并进 config.json，并提交回仓库。
# 电脑关机也照跑，因为跑在 GitHub 的机器上。

on:
  schedule:
    # 每 6 小时一次（UTC）。北京时间 = UTC+8，所以是 02:20 / 08:20 / 14:20 / 20:20
    - cron: "20 */6 * * *"
  workflow_dispatch: {}   # 支持在 Actions 页面手动点一次
  push:
    # 你在网页上改了 sources.txt 或加了 sites/ 片段，提交后立刻跑一次，不用等 6 小时
    paths:
      - "sources.txt"
      - "sites/**"

permissions:
  contents: write         # 需要写权限才能把结果提交回仓库

concurrency:
  group: sync-sources
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并合并点播订阅
        run: python scripts/sync.py

      - name: 抓取公开直播源
        continue-on-error: true   # 直播源抓不到不影响主配置
        run: python scripts/sync_live.py

      - name: 生成单地址合并配置（宝盒菜单 + 自建源）
        continue-on-error: true   # 底座缺失时不阻断主流程
        run: python scripts/build_home.py

      - name: 配置合法性检查
        run: python -c "import json;json.load(open('config.json',encoding='utf-8'));json.load(open('api.json',encoding='utf-8'));json.load(open('dist/home.json',encoding='utf-8'));print('配置合法')"

      - name: 提交变更
        if: always()          # 即使抓取失败也把运行记录提交上去，方便排查
        run: |
          git config user.name  "tvbox-sync[bot]"
          git config user.email "tvbox-sync@users.noreply.github.com"
          FILES="config.json api.json dist/home.json sync-status.md vod-status.md sub/live.txt live-status.md"

          commit() {
            git add -A -- $FILES
            if git diff --cached --quiet; then
              echo "配置与记录均无变化，跳过提交"
              return 1
            fi
            git commit -m "sync: $(date -u +'%Y-%m-%dT%H:%M:%SZ') 更新点播订阅与直播源"
            return 0
          }

          commit || exit 0

          # 期间若有人在网页上改过文件，push 会被拒。
          # 这些文件全部由脚本生成，所以不强行解决冲突，而是回到远端最新再生成一遍。
          for i in 1 2 3; do
            if git push; then
              echo "已推送"
              exit 0
            fi
            echo "push 被拒，第 $i 次：拉取远端最新后重新生成"
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync.py || true
            python scripts/sync_live.py || true
            python scripts/build_home.py || true
            commit || exit 0
            sleep 3
          done
          echo "连续 3 次推送失败，留给下一轮定时任务"
          exit 1
